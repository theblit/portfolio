<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau message de contact</title>
    <style>
        body { background-color: #f4f4f4; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 24px; }
        h1 { color: #1e88e5; font-size: 20px; margin-bottom: 16px; }
        p { color: #333333; line-height: 1.6; font-size: 14px; }
        .label { font-weight: bold; }
        .footer { margin-top: 24px; font-size: 12px; color: #777777; }
    </style>
</head>
<body>
<div class="card">
    <h1>Nouveau message de contact</h1>
    <p><span class="label">Nom :</span> {{ nom }}</p>
    <p><span class="label">Email :</span> {{ email }}</p>
    <p><span class="label">Sujet :</span> {{ sujet }}</p>
    <p><span class="label">Message :</span></p>
    <p>{{ message|linebreaksbr }}</p>
    <p class="footer">
        Cet email a été envoyé depuis le formulaire de contact de votre portfolio.
    </p>
</div>
</body>
</html>
