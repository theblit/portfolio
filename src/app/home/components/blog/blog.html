<section class="blog" id="blog">
            <div class="container d-flex flex-column justify-content-between h-100 ">
                <div class="section-title flex-grow-1">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="text-center">
                                <h2 data-aos="heading-show" class="rect_heading">My Articles</h2>
                                <p class="m-0">Articles about what I expect from myself</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="section-content flex-grow-1">
                    <div class="row">
                        <div class="col-lg-4 col-md-12" *ngFor="let post of posts">
                            <div class="news-item mb-5 mb-lg-0">
                                <div class="news-cover">
                                    <img [src]="'http://localhost:8000' + post.image_couverture" width="800" height="530" alt="" class="img-fluid">
                                </div>
                                <div class="news-content p-4">
                                    <div class="news-title mb-3">
                                        <a [routerLink]="['/articles', post.slug]" class="blog-permalink">
                                            <h3>{{ post.titre }}</h3>
                                        </a>
                                    </div>
                                    <div class="news-meta d-flex flex-row mb-4">
                                        <div class="news-meta-single mr-3">
                                            <span class="mbri-calendar"></span>
                                            <span class="meta-value">{{ post.created_at | date:'dd MMMM, yyyy' }}</span>
                                        </div>
                                        <div class="news-meta-single">
                                            <span class="mbri-user"></span>
                                            <span class="meta-value">{{ post.categorie }}</span>
                                        </div>
                                    </div>
                                    <div class="readMore">
                                        <a [routerLink]="['/articles', post.slug]" class="btn btn-outline-primary">Read More</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
