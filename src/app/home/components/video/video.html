<div class="section about_movie text-center d-flex flex-column align-items-center backgound-section" style="background-image: url(https://via.placeholder.com/1920x1080)">
            <div class="video-area" *ngIf="videos.length > 0">
                <div class="row w-100">
                    <div class="col-md-6 offset-md-3" *ngFor="let video of videos">
                        <div class="embed-responsive embed-responsive-16by9 mb-4">
                            <iframe class="embed-responsive-item"
                                    [src]="'https://www.youtube.com/embed/' + video.youtube_id"
                                    allowfullscreen></iframe>
                        </div>
                        <p class="mt-2">{{ video.titre }}</p>
                    </div>
                </div>
            </div>
        </div>
